# Pixelskolan som iOS-app: Codemagic bygger app/ (Capacitor) på en Mac i molnet och skickar bygget till
# TestFlight – samma upplägg som Pixelcity (8bitcat/snabbfilen). Spelet är detsamma som på webben:
# app/build.mjs kopierar sidan (index.html, skolans filer, sf/ och assets/) till app/www.
#   Starta: Codemagic → pixelskolan → Start new build → iOS → TestFlight
#   Signering: App Store-profilen "Pixelskolan App Store" hämtad i Codemagic (Code signing identities →
#   iOS provisioning profiles → Fetch profiles), samma Apple Distribution-certifikat som Pixelcity.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic        # API-nyckelns namn i Codemagic (Integrations → Developer Portal)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.eightbitcat.pixelskolan
      vars:
        APP_STORE_APPLE_ID: 6821125548    # Pixelskolan i App Store Connect (App Information → Apple ID)
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Installera
        script: cd app && npm ci
      - name: Spelet in i appen
        script: cd app && node build.mjs && npx cap sync ios
      - name: Signering
        script: xcode-project use-profiles
      - name: Version och byggnummer
        script: |
          # appens version i App Store = app/package.json appVersion (t.ex. 1.0); byggnumret = senaste TestFlight-bygge + 1
          VERSION=$(node -p "require('./app/package.json').appVersion")
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD=$((LATEST + 1))
          echo "Pixelskolan $VERSION (bygge $BUILD)"
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD;/" app/ios/App/App.xcodeproj/project.pbxproj
      - name: Bygg ipa
        script: |
          cd app/ios/App
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - app/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # bara uppladdning: interna testare (Carl) får bygget direkt i TestFlight
        submit_to_testflight: false
        submit_to_app_store: false
